name: Staging CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inspect cached Supabase images
        shell: bash
        run: |
          set -euo pipefail
          images=(
            "public.ecr.aws/supabase/logflare"
            "public.ecr.aws/supabase/storage-api"
            "public.ecr.aws/supabase/gotrue"
            "public.ecr.aws/supabase/realtime"
            "public.ecr.aws/supabase/postgres"
            "public.ecr.aws/supabase/mailpit"
          )
          for image in "${images[@]}"; do
            if docker image ls --format '{{.Repository}}' | grep -Fxq "$image"; then
              echo "cached: $image"
            else
              echo "not cached: $image"
            fi
          done

      - name: Start local Supabase with rate-limit retries
        shell: bash
        run: |
          set -uo pipefail
          max_attempts=5
          backoff_seconds=15
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Starting local Supabase (attempt ${attempt}/${max_attempts})..."
            if npx supabase start; then
              echo "Supabase started successfully."
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Supabase startup failed. Waiting ${backoff_seconds}s before retrying..."
              sleep "$backoff_seconds"
              backoff_seconds=$((backoff_seconds * 2))
            fi
          done
          echo "Supabase failed to start after ${max_attempts} attempts."
          exit 1

      - name: Validate local Supabase migrations
        run: npm run db:gate
        env:
          REQUIRE_SUPABASE: 'true'

      - name: Install Playwright browsers (CRITICAL for test environment)
        run: npx playwright install --with-deps chromium

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint strict mode (zero warnings allowed)
        run: npx eslint . --max-warnings 0

      - name: Run full Playwright test suite
        run: npx playwright test

      - name: Build production bundle
        run: npm run build

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit (fail on high/critical)
        run: npm audit --audit-level=high
